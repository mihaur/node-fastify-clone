---
name: actions-template-sync

permissions: read-all

on: # yamllint disable-line rule:truthy
  # cronjob trigger At 00:00 on day-of-month 1. https://crontab.guru/every-month
  schedule:
    - cron: "0 0 1 * *"
  # manual trigger
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # To use this repository's private action, you must check out the repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: actions-template-sync
        uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_repo_path: mihaur/node-fastify-template
          upstream_branch: main # defaults to main
